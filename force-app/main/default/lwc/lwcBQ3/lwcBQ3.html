<template>
    <lightning-card
        title="Most Popular Wikipedia Page Views -  Last 24 Hrs"
        icon-name="custom:custom14"
    >
        <div class="slds-box">
            <p class="message">Messages: {msg}</p>
        </div>
        <div class="slds-m-around_medium">
            <lightning-datatable
                key-field="id"
                data={result.data}
                columns={columns}
                hide-checkbox-column="true"
            >
            </lightning-datatable>
        </div>
    </lightning-card>
</template>

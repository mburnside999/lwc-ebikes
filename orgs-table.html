<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Orgs Table</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #4A90E2;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            border-right: 1px solid #3a7bc8;
        }
        th:last-child {
            border-right: none;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
            font-size: 13px;
        }
        td:last-child {
            border-right: none;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <table id="orgsTable">
            <thead>
                <tr>
                    <th>Org ID</th>
                    <th>Org Name /Edition / Pod</th>
                    <th>Domain</th>
                    <th>Edition</th>
                    <th>Instance</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>00D5f000006Oghx</td>
                    <td>Toyota New Zealand</td>
                    <td>tnz-c360a</td>
                    <td>Enterprise</td>
                    <td>NA244</td>
                    <td></td>
                </tr>
                <tr>
                    <td>00D28000000bHiQ</td>
                    <td>Toyota New Zealand</td>
                    <td>toyotacrm</td>
                    <td>Enterprise</td>
                    <td>AUS90</td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
